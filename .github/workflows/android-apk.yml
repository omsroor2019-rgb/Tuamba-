name: Build CITY LIFE 3D V7.2.1 Android Save Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          path: game-source
          persist-credentials: false

      - name: Run project asset and configuration checks
        shell: bash
        run: |
          set -euo pipefail
          python3 game-source/tools/verify_project.py

      - name: Verify game source
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f game-source/assets/ui/arabic-ui.png ]]; then
            echo "ERROR: Arabic UI atlas is missing."
            exit 1
          fi

          if [[ -f game-source/src/main.c ]]; then
            echo "GAME_SOURCE=game-source/src/main.c" >> "$GITHUB_ENV"
          elif [[ -f game-source/main.c ]]; then
            echo "GAME_SOURCE=game-source/main.c" >> "$GITHUB_ENV"
          else
            echo "ERROR: main.c was not found."
            find game-source -maxdepth 4 -type f -print
            exit 1
          fi

      - name: Checkout raymob Android template
        uses: actions/checkout@v4
        with:
          repository: KarvinJ/raylib-mobile
          ref: main
          path: android-project
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This action accepts SDK licenses itself.
      # An empty packages input prevents automatic installation of
      # legacy SDK packages. Required packages are installed below.
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Install CITY LIFE 3D source into Android template
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-project/app/src/main/cpp
          mkdir -p android-project/app/src/main/assets
          cp "$GAME_SOURCE" android-project/app/src/main/cpp/main.c

          # raylib reads game resources from the Android APK assets directory.
          if [[ -d game-source/assets ]]; then
            cp -R game-source/assets/. android-project/app/src/main/assets/
          fi

          # Validate every playlist entry before starting the native build.
          python3 - <<'PY'
          from pathlib import Path

          music_dir = Path("game-source/assets/music")
          playlist = music_dir / "playlist.txt"
          if not playlist.is_file():
              raise SystemExit("ERROR: assets/music/playlist.txt is missing")

          entries = []
          for raw in playlist.read_text(encoding="utf-8-sig").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              filename = line.split("|", 1)[0].strip()
              if not filename or Path(filename).name != filename:
                  raise SystemExit(f"ERROR: invalid playlist filename: {line!r}")
              audio = music_dir / filename
              if not audio.is_file():
                  raise SystemExit(f"ERROR: playlist track not found: {audio}")
              data = audio.read_bytes()[:12]
              suffix = audio.suffix.lower()
              valid = (
                  (suffix == ".ogg" and data.startswith(b"OggS")) or
                  (suffix == ".mp3" and (data.startswith(b"ID3") or (len(data) >= 2 and data[0] == 0xFF and (data[1] & 0xE0) == 0xE0))) or
                  (suffix == ".wav" and data.startswith(b"RIFF"))
              )
              if not valid:
                  raise SystemExit(f"ERROR: audio content does not match extension: {audio}")
              entries.append(filename)

          if len(entries) != 5:
              raise SystemExit(f"ERROR: expected exactly the user's 5 tracks, found {len(entries)}")

          packaged_ogg = sorted(p.name for p in music_dir.glob("*.ogg"))
          if packaged_ogg != sorted(entries):
              raise SystemExit(
                  f"ERROR: music folder must contain only playlist tracks; "
                  f"playlist={sorted(entries)}, files={packaged_ogg}"
              )

          print(f"Validated {len(entries)} user-supplied audio tracks only")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import wave

          sfx_dir = Path("game-source/assets/sfx")
          expected = ["pistol.wav", "rifle.wav", "shotgun.wav", "reload.wav",
                      "jump.wav", "footstep.wav", "melee.wav", "impact.wav"]
          for name in expected:
              path = sfx_dir / name
              if not path.is_file():
                  raise SystemExit(f"ERROR: required game sound is missing: {path}")
              try:
                  with wave.open(str(path), "rb") as wav:
                      if wav.getnchannels() not in (1, 2) or wav.getframerate() < 8000:
                          raise SystemExit(f"ERROR: unsupported sound format: {path}")
              except wave.Error as exc:
                  raise SystemExit(f"ERROR: invalid WAV sound {path}: {exc}")
          print(f"Validated {len(expected)} gameplay sound effects")
          PY

          test -f android-project/app/src/main/assets/music/playlist.txt
          test -f android-project/app/src/main/assets/sfx/pistol.wav
          test -f android-project/app/src/main/cpp/CMakeLists.txt
          test -f android-project/gradlew
          test -f android-project/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android-project/gradle.properties")
          values = {
              "projectName": "city-life-3d",
              "app.name": "CITY LIFE 3D",
              "app.native_library_name": "citylife3d",
              "app.application_id": "com.citylife3d.game",
              "app.category": "LAUNCHER", 
              "app.orientation": "landscape",
              "app.version_name": "0.7.3",
              "app.version_code": "12",
              "gl.version": "ES20",
              "display.keep_on": "true",
              "display.immersive": "true",
              "display.into_cutout": "true",
              "requirements.internet": "false",
              "requirements.vibration": "false",
              "requirements.gyroscope": "false",
              "requirements.accelerometer": "false",
          }

          original_lines = path.read_text(encoding="utf-8").splitlines()
          result = []
          seen = set()

          for line in original_lines:
              stripped = line.strip()

              if stripped and not stripped.startswith("#") and "=" in stripped:
                  key = stripped.split("=", 1)[0].strip()

                  if key in values:
                      result.append(f"{key}={values[key]}")
                      seen.add(key)
                      continue

              result.append(line)

          for key, value in values.items():
              if key not in seen:
                  result.append(f"{key}={value}")

          path.write_text(
              "\n".join(result) + "\n",
              encoding="utf-8"
          )
          PY

          chmod +x android-project/gradlew
          echo "Using game source: $GAME_SOURCE"

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android-project/app/build/outputs/apk/debug"

          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "ERROR: No APK file was generated."
            find android-project/app/build/outputs -type f -print || true
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CITY-LIFE-3D-V7.2.1-ANDROID-SAVE-FIX-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
